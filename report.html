<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모의고사 분석 리포트</title>
<style>
  :root { color-scheme: light; }
  body { font: 15px/1.6 system-ui, "Malgun Gothic", sans-serif; margin: 0; background: #f6f7f9; color: #1a1d21; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 20px 80px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0 0 10px; padding-bottom: 6px; border-bottom: 1px solid #dde1e6; }
  section { background: #fff; border: 1px solid #dde1e6; border-radius: 8px; padding: 16px 18px; margin-bottom: 18px; }
  input, select, button { font: inherit; padding: 7px 10px; border: 1px solid #c3c9d0; border-radius: 5px; background: #fff; }
  button { background: #1a1d21; color: #fff; border-color: #1a1d21; cursor: pointer; }
  button:hover:not(:disabled) { background: #34383e; }
  button:disabled { background: #c3c9d0; border-color: #c3c9d0; cursor: not-allowed; }
  button.ghost { background: #fff; color: #1a1d21; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  table { border-collapse: collapse; font-size: 13px; width: 100%; }
  th, td { text-align: right; padding: 5px 8px; border-bottom: 1px solid #eceef1; white-space: nowrap; }
  th:first-child, td:first-child, th.l, td.l { text-align: left; }
  th { color: #5a626b; font-weight: 600; position: sticky; top: 0; background: #fff; }
  .scroll { overflow-x: auto; max-height: 560px; overflow-y: auto; }
  .muted { color: #5a626b; font-size: 13px; }
  .msg { padding: 10px 12px; border-radius: 6px; margin: 10px 0; white-space: pre-wrap; }
  .msg.err { background: #fdecec; color: #8c1c1c; }
  .msg.ok  { background: #e8f5ec; color: #14532d; }
  .flag { background: #fdecec; }        /* 우리 학교가 전체보다 크게 낮은 문항 */
  .good { background: #e8f5ec; }
  .weak { color: #8c1c1c; font-weight: 600; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>모의고사 분석 리포트</h1>
  <p class="muted">문항분석과 학교별 결과. 학생은 학년·반·번호로만 표시됩니다.</p>

  <section id="login">
    <h2>로그인</h2>
    <form class="row" id="loginForm">
      <input type="email" id="email" placeholder="이메일" required autocomplete="username">
      <input type="password" id="pw" placeholder="비밀번호" required autocomplete="current-password">
      <button>로그인</button>
    </form>
    <div id="loginMsg"></div>
  </section>

  <div id="app" hidden>
    <section>
      <div class="row" style="justify-content:space-between;margin:0">
        <span id="who" class="muted"></span>
        <button class="ghost" id="logout">로그아웃</button>
      </div>
    </section>

    <section>
      <div class="row" style="margin:0">
        <select id="exam"></select>
        <button id="load">불러오기</button>
        <button class="ghost" id="xlsx" disabled>엑셀로 저장</button>
      </div>
      <div id="msg"></div>
    </section>

    <section id="sumSec" hidden>
      <h2>과목별 요약</h2>
      <div class="scroll"><table id="sumTable"></table></div>
    </section>

    <section id="itemSec" hidden>
      <h2>문항분석</h2>
      <div class="row">
        <select id="subject"></select>
        <span class="muted">정답률이 전체보다 10%p 이상 낮은 문항은 붉게 표시됩니다.</span>
      </div>
      <div class="scroll"><table id="itemTable"></table></div>
    </section>

    <section id="distSec" hidden>
      <h2>오답지 매력도</h2>
      <p class="muted">상위 27%가 특정 오답에 몰린 문항이 먼저 나옵니다 — 출제·수업 개선에서 가장 값진 신호입니다.</p>
      <div class="scroll"><table id="distTable"></table></div>
    </section>

    <section id="stuSec" hidden>
      <h2>학생별 원점수</h2>
      <div class="scroll"><table id="stuTable"></table></div>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="config.js"></script>
<script>
const SUBJECTS = ['국어', '영어', '수학', '사회', '과학', '한국사'];
const db = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));
const say = (el, t, kind) => { el.innerHTML = t ? `<div class="msg ${kind || 'err'}">${esc(t)}</div>` : ''; };
const pct = v => v == null ? '' : (v * 100).toFixed(1) + '%';
const num = v => v == null ? '' : (+v).toFixed(2);

let me = null, data = null;

// ── 인증 ────────────────────────────────────────────
$('loginForm').onsubmit = async e => {
  e.preventDefault();
  const { error } = await db.auth.signInWithPassword({ email: $('email').value, password: $('pw').value });
  if (error) say($('loginMsg'), error.message);
};
$('logout').onclick = () => db.auth.signOut();

db.auth.onAuthStateChange(async (_, session) => {
  if (!session) { $('login').hidden = false; $('app').hidden = true; return; }
  const { data: p } = await db.from('profiles').select('school_code, role').eq('user_id', session.user.id).maybeSingle();
  const { data: s } = p?.school_code
    ? await db.from('schools').select('school_name').eq('school_code', p.school_code).maybeSingle() : { data: null };
  me = { ...p, school_name: s?.school_name ?? p?.school_code ?? '(학교 미배정)' };
  $('login').hidden = true; $('app').hidden = false;
  $('who').textContent = `${me.school_name} · ${session.user.email}`;
  const { data: ex } = await db.from('exams').select('*').eq('is_open', true).order('exam_code', { ascending: false });
  $('exam').innerHTML = (ex ?? []).map(x => `<option value="${esc(x.exam_code)}">${esc(x.exam_name)}</option>`).join('');
  if (!ex?.length) say($('msg'), '아직 열람 가능한 회차가 없습니다. 회차가 개방되면 볼 수 있습니다.');
});

// PostgREST는 한 번에 1000행까지만 준다. 정오표는 3만 행이 넘으므로 나눠 받는다.
async function fetchAll(build) {
  const out = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await build().range(from, from + 999);
    if (error) throw new Error(error.message);
    out.push(...data);
    if (data.length < 1000) return out;
  }
}

// ── 불러오기 ────────────────────────────────────────
$('load').onclick = async () => {
  const exam = $('exam').value;
  if (!exam) return;
  $('load').disabled = true; $('xlsx').disabled = true;
  say($('msg'), '불러오는 중…', 'ok');
  try {
    const [{ data: summary, error: e1 }, { data: items, error: e2 }] = await Promise.all([
      db.rpc('exam_school_summary', { p_exam: exam }),
      db.rpc('exam_item_stats', { p_exam: exam }),
    ]);
    if (e1 || e2) throw new Error((e1 || e2).message);
    if (!items?.length) throw new Error('데이터가 없습니다. 회차가 개방되었고 제출이 있는지 확인하세요.');

    const scores = await fetchAll(() => db.from('student_scores')
      .select('grade, class_no, student_no, subject, raw_score, n_correct, n_items')
      .eq('exam_code', exam).order('grade').order('class_no').order('student_no'));
    const marks = await fetchAll(() => db.from('scored')
      .select('grade, class_no, student_no, subject, q_no, marked, is_correct')
      .eq('exam_code', exam).order('subject').order('grade').order('class_no').order('student_no').order('q_no'));

    const dists = {};
    for (const s of [...new Set(items.map(i => i.subject))]) {
      const { data } = await db.rpc('exam_distractors', { p_exam: exam, p_subject: s });
      dists[s] = data ?? [];
    }
    data = { exam, name: $('exam').selectedOptions[0].textContent, summary, items, scores, marks, dists };
    render();
    say($('msg'), `${data.name} — 문항 ${items.length}개, 학생 ${new Set(scores.map(s => `${s.grade}-${s.class_no}-${s.student_no}`)).size}명`, 'ok');
    $('xlsx').disabled = false;
  } catch (err) {
    say($('msg'), err.message);
  }
  $('load').disabled = false;
};

// ── 화면 ────────────────────────────────────────────
function render() {
  $('sumTable').innerHTML =
    '<tr><th class="l">과목</th><th>우리 응시</th><th>우리 평균</th><th>우리 표준편차</th>' +
    '<th>전체 응시</th><th>전체 평균</th><th>전체 표준편차</th><th>차이</th></tr>' +
    data.summary.map(r => `<tr><td class="l">${esc(r.subject)}</td><td>${r.my_takers}</td><td>${num(r.my_mean)}</td>
      <td>${num(r.my_sd)}</td><td>${r.all_takers}</td><td>${num(r.all_mean)}</td><td>${num(r.all_sd)}</td>
      <td class="${r.gap < 0 ? 'weak' : ''}">${r.gap > 0 ? '+' : ''}${num(r.gap)}</td></tr>`).join('');
  $('sumSec').hidden = false;

  const subs = [...new Set(data.items.map(i => i.subject))];
  $('subject').innerHTML = subs.map(s => `<option>${esc(s)}</option>`).join('');
  $('subject').onchange = renderSubject;
  renderSubject();
  $('itemSec').hidden = $('distSec').hidden = false;

  // 학생별 원점수 — 과목을 열로 펼친다
  const by = {};
  data.scores.forEach(s => {
    const k = `${s.grade}-${s.class_no}-${s.student_no}`;
    (by[k] ??= { k, g: s.grade, c: s.class_no, n: s.student_no })[s.subject] = s.raw_score;
  });
  $('stuTable').innerHTML =
    '<tr><th class="l">학년</th><th class="l">반</th><th class="l">번호</th>' + subs.map(s => `<th>${esc(s)}</th>`).join('') + '</tr>' +
    Object.values(by).map(r => `<tr><td class="l">${r.g}</td><td class="l">${r.c}</td><td class="l">${r.n}</td>` +
      subs.map(s => `<td>${r[s] ?? ''}</td>`).join('') + '</tr>').join('');
  $('stuSec').hidden = false;
}

function renderSubject() {
  const sub = $('subject').value;
  const rows = data.items.filter(i => i.subject === sub);
  $('itemTable').innerHTML =
    '<tr><th class="l">문항</th><th class="l">유형</th><th>배점</th><th>전체 정답률</th><th>우리 정답률</th>' +
    '<th>차이</th><th>변별도</th><th>D지수</th><th>무응답률</th></tr>' +
    rows.map(r => {
      const gap = (r.my_p_value ?? 0) - r.p_value;
      const cls = r.my_p_value != null && gap <= -0.10 ? 'flag' : (gap >= 0.10 ? 'good' : '');
      return `<tr class="${cls}"><td class="l">${r.q_no}</td><td class="l">${r.q_type === 'SA' ? '단답' : '객관'}</td>
        <td>${num(r.points)}</td><td>${pct(r.p_value)}</td><td>${pct(r.my_p_value)}</td>
        <td>${r.my_p_value == null ? '' : (gap > 0 ? '+' : '') + (gap * 100).toFixed(1) + 'p'}</td>
        <td>${num(r.discrimination)}</td><td>${num(r.d_index)}</td><td>${pct(r.blank_rate)}</td></tr>`;
    }).join('');

  // 상위 집단이 몰린 오답부터
  const d = (data.dists[sub] ?? []).filter(x => !x.is_answer && x.choice !== '무응답' && x.rate_high != null);
  d.sort((a, b) => b.rate_high - a.rate_high);
  $('distTable').innerHTML =
    '<tr><th class="l">문항</th><th class="l">선택지</th><th>전체 선택률</th><th>상위 27%</th><th>하위 27%</th><th>상위−하위</th></tr>' +
    d.slice(0, 40).map(x => `<tr><td class="l">${x.q_no}</td><td class="l">${esc(x.choice)}</td>
      <td>${pct(x.rate_all)}</td><td class="${x.rate_high > x.rate_low ? 'weak' : ''}">${pct(x.rate_high)}</td>
      <td>${pct(x.rate_low)}</td><td>${((x.rate_high - x.rate_low) * 100).toFixed(1)}p</td></tr>`).join('');
}

// ── 엑셀 저장 ───────────────────────────────────────
$('xlsx').onclick = async () => {
  $('xlsx').disabled = true;
  const wb = new ExcelJS.Workbook();
  const head = (ws, cols) => {
    ws.columns = cols;
    ws.getRow(1).font = { bold: true };
    ws.getRow(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFEFF1F3' } };
    ws.views = [{ state: 'frozen', ySplit: 1 }];
    ws.autoFilter = { from: { row: 1, column: 1 }, to: { row: 1, column: cols.length } };
  };
  const RED = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFDE7E7' } };
  const GREEN = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE8F5EC' } };

  // 1. 요약
  const s1 = wb.addWorksheet('과목별 요약');
  head(s1, [
    { header: '과목', key: 'subject', width: 10 }, { header: '우리 응시', key: 'my_takers', width: 10 },
    { header: '우리 평균', key: 'my_mean', width: 10 }, { header: '우리 표준편차', key: 'my_sd', width: 12 },
    { header: '전체 응시', key: 'all_takers', width: 10 }, { header: '전체 평균', key: 'all_mean', width: 10 },
    { header: '전체 표준편차', key: 'all_sd', width: 12 }, { header: '차이', key: 'gap', width: 8 },
  ]);
  data.summary.forEach(r => { const row = s1.addRow(r); if (r.gap < 0) row.getCell('gap').fill = RED; });

  // 2. 문항분석
  const s2 = wb.addWorksheet('문항분석');
  head(s2, [
    { header: '과목', key: 'subject', width: 10 }, { header: '문항', key: 'q_no', width: 6 },
    { header: '유형', key: 'q_type', width: 6 }, { header: '배점', key: 'points', width: 6 },
    { header: '전체 정답률', key: 'p_value', width: 11 }, { header: '우리 정답률', key: 'my_p', width: 11 },
    { header: '차이(%p)', key: 'gap', width: 10 }, { header: '변별도', key: 'discrimination', width: 9 },
    { header: 'D지수', key: 'd_index', width: 8 }, { header: '무응답률', key: 'blank_rate', width: 10 },
  ]);
  data.items.forEach(r => {
    const gap = r.my_p_value == null ? null : (r.my_p_value - r.p_value) * 100;
    const row = s2.addRow({ ...r, q_type: r.q_type === 'SA' ? '단답' : '객관', my_p: r.my_p_value, gap });
    ['p_value', 'my_p', 'blank_rate'].forEach(k => row.getCell(k).numFmt = '0.0%');
    if (gap != null && gap <= -10) row.getCell('gap').fill = RED;
    if (gap != null && gap >= 10) row.getCell('gap').fill = GREEN;
    if (r.discrimination != null && r.discrimination < 0.2) row.getCell('discrimination').fill = RED;
  });

  // 3. 오답지 매력도
  const s3 = wb.addWorksheet('오답지 매력도');
  head(s3, [
    { header: '과목', key: 'subject', width: 10 }, { header: '문항', key: 'q_no', width: 6 },
    { header: '선택지', key: 'choice', width: 8 }, { header: '정답', key: 'is_answer', width: 6 },
    { header: '전체 선택률', key: 'rate_all', width: 11 }, { header: '상위 27%', key: 'rate_high', width: 10 },
    { header: '하위 27%', key: 'rate_low', width: 10 }, { header: '상위−하위', key: 'diff', width: 10 },
  ]);
  Object.entries(data.dists).forEach(([subject, arr]) => arr.forEach(x => {
    const row = s3.addRow({ ...x, subject, is_answer: x.is_answer ? 'O' : '',
      diff: x.rate_high == null ? null : x.rate_high - x.rate_low });
    ['rate_all', 'rate_high', 'rate_low', 'diff'].forEach(k => row.getCell(k).numFmt = '0.0%');
    if (!x.is_answer && x.rate_high > x.rate_low) row.getCell('rate_high').fill = RED;  // 상위가 더 많이 고른 오답
  }));

  // 4. 학생별 원점수
  const subs = [...new Set(data.items.map(i => i.subject))];
  const s4 = wb.addWorksheet('학생별 원점수');
  head(s4, [{ header: '학년', key: 'g', width: 6 }, { header: '반', key: 'c', width: 6 }, { header: '번호', key: 'n', width: 6 },
    ...subs.map(s => ({ header: s, key: s, width: 9 }))]);
  const by = {};
  data.scores.forEach(s => {
    const k = `${s.grade}-${s.class_no}-${s.student_no}`;
    (by[k] ??= { g: s.grade, c: s.class_no, n: s.student_no })[s.subject] = s.raw_score;
  });
  Object.values(by).forEach(r => s4.addRow(r));

  // 5. 학생별 정오표 — 과목마다 문항 수가 다르므로 한 시트에 과목 열을 둔다
  const maxQ = Math.max(...data.items.map(i => i.q_no));
  const s5 = wb.addWorksheet('학생별 정오표');
  head(s5, [{ header: '과목', key: 'subject', width: 10 }, { header: '학년', key: 'g', width: 6 },
    { header: '반', key: 'c', width: 6 }, { header: '번호', key: 'n', width: 6 },
    ...Array.from({ length: maxQ }, (_, i) => ({ header: String(i + 1), key: 'q' + (i + 1), width: 4 }))]);
  const grid = {};
  data.marks.forEach(m => {
    const k = `${m.subject}|${m.grade}-${m.class_no}-${m.student_no}`;
    (grid[k] ??= { subject: m.subject, g: m.grade, c: m.class_no, n: m.student_no })['q' + m.q_no] = m.is_correct ? 'O' : 'X';
  });
  Object.values(grid).forEach(r => {
    const row = s5.addRow(r);
    for (let q = 1; q <= maxQ; q++) if (row.getCell('q' + q).value === 'X') row.getCell('q' + q).fill = RED;
  });

  const buf = await wb.xlsx.writeBuffer();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  a.download = `${data.name}_${me.school_name}_분석.xlsx`.replace(/[\\/:*?"<>|]/g, '_');
  a.click();
  URL.revokeObjectURL(a.href);
  $('xlsx').disabled = false;
};
</script>
</body>
</html>
